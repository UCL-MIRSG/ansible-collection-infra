---
# Deliberately not the firewalld role: that also sets the default zone and
# closes services, which would undo settings from the host's own deploy

- name: Get the state of services
  ansible.builtin.service_facts:

# If firewalld is installed but stopped, write the permanent config offline so
# the exporter port is open once it starts
- name: Allow the monitoring server to reach node_exporter
  when: "'firewalld.service' in ansible_facts.services"
  vars:
    monitoring_client_firewalld_running:
      "{{ ansible_facts.services['firewalld.service'].state == 'running' }}"
  block:
    - name:
        Bind the monitoring server to the firewalld zone - {{
        monitoring_client_firewalld_zone }}
      ansible.posix.firewalld:
        zone: "{{ monitoring_client_firewalld_zone }}"
        source: "{{ monitoring_client_monitoring_server_ip }}"
        permanent: true
        immediate: "{{ monitoring_client_firewalld_running }}"
        offline: "{{ not monitoring_client_firewalld_running }}"
        state: enabled

    - name:
        Allow node_exporter from the monitoring server only - {{
        monitoring_client_node_exporter_port }}
      ansible.posix.firewalld:
        zone: "{{ monitoring_client_firewalld_zone }}"
        rich_rule: >-
          rule family=ipv4 source address={{
          monitoring_client_monitoring_server_ip }}/32 port protocol=tcp port={{
          monitoring_client_node_exporter_port }} accept
        permanent: true
        immediate: "{{ monitoring_client_firewalld_running }}"
        offline: "{{ not monitoring_client_firewalld_running }}"
        state: enabled
