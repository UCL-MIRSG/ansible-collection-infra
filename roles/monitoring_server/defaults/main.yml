---
monitoring_server_owner: monitoring
monitoring_server_group: monitoring
monitoring_server_gid: 595
monitoring_server_uid: 595
monitoring_server_cert_owner: root
monitoring_server_cert_group: root
monitoring_server_storage_root: /data/monitoring
monitoring_server_web_group: web

# mirsg.monitoring_server CA and server certificate
monitoring_server_certificate_cache_directory:
  "{{ lookup('env', 'HOME')
  }}/ansible_persistent_files/monitoring_server_certificates"
monitoring_server_certificate_directory: /root/monitoring_certs
monitoring_server_ca_key: "{{ monitoring_server_certificate_directory }}/ca.key"
monitoring_server_ca_csr: "{{ monitoring_server_certificate_directory }}/ca.csr"
monitoring_server_ca_cert:
  "{{ monitoring_server_certificate_directory }}/ca.pem"
monitoring_server_server_key:
  "{{ monitoring_server_certificate_directory }}/server-key.pem"
monitoring_server_server_csr:
  "{{ monitoring_server_certificate_directory }}/server.csr"
monitoring_server_server_cert:
  "{{ monitoring_server_certificate_directory }}/server-cert.pem"

# mirsg.monitoring_server client related
monitoring_server_client_certificate_directory:
  "{{ monitoring_server_certificate_directory }}/client_certs"
monitoring_server_client_group: monitoring_client

monitoring_server_smtp_enabled: false
monitoring_server_smtp_hostname: ""
monitoring_server_smtp_port: 25
monitoring_server_smtp_protocol: smtp
monitoring_server_smtp_auth: ""
monitoring_server_smtp_username: ""
monitoring_server_smtp_password: ""
monitoring_server_smtp_start_tls: false
ssl_trust: "*"

monitoring_server_slack_enabled: false
monitoring_server_slack_webhook_url: ""
monitoring_server_slack_channel: ""

# mirsg.monitoring_server AlertManager Configuration
#
# templates/alertmanager.yml.j2 assembles this structured data into a valid
# alertmanager config structure and serialises it. Change policy here rather
# than writing it by hand in the template.
#
# The defaults here define:
# - Three severity/alert tiers
# - One receiver per tier, and one route per tier under every alert group below
# - `send_resolved` is true only for critical
# - Asymmetric notification channels:
#   - critical - Slack *and* email
#   - warning  - Slack, falling back to email only when Slack is disabled
#   - info - Slack only, silent when Slack is disabled
monitoring_server_alert_tiers:
  - name: critical
    # Urgent, user-impacting: notify fast, remind every few hours.
    receiver: mirsg-critical
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    send_resolved: true
    slack: true
    email: true
    email_fallback: false
  - name: warning
    # Act-soon: batch a little, then remind every few days.
    receiver: mirsg-warning
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 72h
    send_resolved: false
    slack: true
    email: false
    email_fallback: true
  - name: info
    receiver: mirsg-info
    # Awareness only: notify once, effectively no reminders.
    group_wait: 5m
    group_interval: 30m
    repeat_interval: 168h
    send_resolved: false
    slack: true
    email: false
    email_fallback: false

# How alerts are grouped into notifications. Each entry becomes one Alertmanager
# route carrying the severity child routes defined above.
#
# Routes are first-match-wins, so order matters. The last entry has no
# `alertnames` and so claims everything not matched above it. To add a grouping,
# add an entry above that catch-all; the template needs no change.
monitoring_server_alertmanager_alert_groups:
  # Filesystem alerts group per filesystem rather than per host, so a shared
  # network export monitored from two hosts produces one notification instead of
  # two.
  - name: filesystem
    alertnames:
      - FilesystemFull
      - InodeUsageHigh
    group_by:
      - alertname
      - severity
      - device
      - mountpoint

  # Everything else, grouped per-alert and per-host so one host's issue is its
  # own notification rather than being collapsed with every other host firing
  # the same alert.
  - name: default
    group_by:
      - alertname
      - instance

# Suppress lower-severity noise while a higher severity is firing for the same
# thing. Order matters: Alertmanager evaluates these in sequence.
monitoring_server_alertmanager_inhibit_rules:
  # An unreachable host shouldn't also send CPU, memory and disk
  # warnings about itself, nor its endpoint and certificate alerts
  - source_matchers:
      - alertname="InstanceDown"
    target_matchers:
      - severity=~"critical|warning|info"
    equal:
      - host
  # A down endpoint suppresses other alerts about that same endpoint
  - source_matchers:
      - alertname="EndpointDown"
    target_matchers:
      - severity=~"critical|warning|info"
    equal:
      - instance
  # Inhibition of lower alert tiers, scoped to the same alert and the same filesystem
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal:
      - alertname
      - instance
      - device
      - mountpoint
  - source_matchers:
      - severity="warning"
    target_matchers:
      - severity="info"
    equal:
      - alertname
      - instance
      - device
      - mountpoint

monitoring_server_hostname_extractor: ansible_host

monitoring_server_alertmanager:
  container_name: alertmanager
  image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
  external_data_dir: "{{ monitoring_server_storage_root }}/alertmanager"
  volume: /alertmanager
  commandline_args:
    web.external-url: https://{{ monitoring_server_hostname }}/alertmanager/
    storage.path: /alertmanager/data
    config.file: /alertmanager/alertmanager.yml
    data.retention: 336h

monitoring_server_cadvisor:
  container_name: cadvisor
  image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe

monitoring_server_grafana:
  container_name: grafana
  image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
  external_data_dir: "{{ monitoring_server_storage_root }}/grafana"
  external_storage_dir: "{{ monitoring_server_storage_root }}/grafana/storage"
  volume: /var/lib/grafana
  external_datasource:
    "{{ monitoring_server_storage_root }}/grafana/datasources.yml"
  volume_datasource: /etc/grafana/provisioning/datasources/datasources.yml
  environment_variables:
    GF_SECURITY_ADMIN_USER: "{{ monitoring_server_grafana_username }}"
    GF_SECURITY_ADMIN_PASSWORD: "{{ monitoring_server_grafana_password }}"
    GF_SERVER_DOMAIN: "{{ monitoring_server_grafana_host }}"
    GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    GF_SERVER_SERVE_FROM_SUB_PATH: "true"

monitoring_server_nginx:
  owner: root
  group: root
  log_folder: /var/log/nginx
  http_port: 80
  https_port: 443
  certs_dir: /etc/nginx/ssl
  diffie_helman_size_bits: 2048
  dh_params_file: /etc/nginx/ssl/dhparam.pem
  conf_file: /etc/nginx/nginx.conf
  ssl_cert_file: /etc/nginx/ssl/server.cert
  ssl_key_file: /etc/nginx/ssl/server.key

monitoring_server_prometheus:
  image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
  container_name: prometheus
  external_data_dir: "{{ monitoring_server_storage_root }}/prometheus"
  volume: /prometheus
  ca_cert: /prometheus/ca.pem
  rules: /prometheus/rules.yml
  commandline_args:
    config.file: /prometheus/prometheus.yml
    storage.tsdb.path: /prometheus/data
    web.external-url: https://{{ monitoring_server_hostname }}/prometheus/
