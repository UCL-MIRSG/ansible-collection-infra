---
# "package" installs nginx from the nginx.org mainline repository.
# "container" runs the official nginx image with Docker; this is used on EL7
# because nginx.org no longer builds packages for it.
nginx_install_method:
  "{{ 'container' if ansible_facts['distribution_major_version'] is version('7',
  '==') else 'package' }}"

# Pinned by tag and digest so version changes are visible in review. The
# package version is taken from the image tag, so both install methods run the
# same nginx.
nginx_container_image: nginx:1.31.9@sha256:84f7876d21d154885f99554d7ae325d8c2213f9169726ea7ab60642f2573a787
nginx_version:
  "{{ nginx_container_image | regex_search(':([0-9.]+)(@|$)', '\\1') | first }}"

nginx_repo_baseurl: https://nginx.org/packages/mainline/rhel/$releasever/$basearch/
nginx_repo_gpgkey: https://nginx.org/keys/nginx_signing.key

nginx_container_name: nginx

nginx_http2: true

nginx_owner: root
nginx_group: root

nginx_log_folder: /var/log/nginx
nginx_access_log: "{{ nginx_log_folder }}/access.log"
nginx_error_log: "{{ nginx_log_folder }}/error.log"
nginx_app_access_log: "{{ nginx_log_folder }}/app.access.log"
nginx_app_error_log: "{{ nginx_log_folder }}/app.error.log"

nginx_http_port: 80
nginx_https_port: 443

nginx_conf_template: nginx_reverse_proxy.j2 # check the template file for the variables it requires
nginx_conf_file: /etc/nginx/nginx.conf
nginx_add_default_server: true

nginx_ipv6_enabled: false

# Rate limit requests to these paths, per client IP, e.g. login and password
# reset endpoints. Sub-paths and ;parameters after any segment are included,
# and matching is case-insensitive. GET and HEAD requests are only limited when
# they have a query string or a sub-path, so browsers can load a login page.
# URLs with "..;" or ".;" segments are rejected, as Tomcat would resolve them.
# Rate limiting is disabled when empty. Only used by nginx_reverse_proxy.j2.
nginx_rate_limit_paths: [] # yamllint disable-line rule:brackets
nginx_rate_limit_rate: 6r/m
nginx_rate_limit_burst: 5
# Addresses or CIDR ranges that are never rate limited, e.g. a NAT gateway
# that many users share
nginx_rate_limit_allowlist: [] # yamllint disable-line rule:brackets
# Who people who are rate limited should contact, e.g. a support page URL or a
# shared helpdesk address. Anyone who is limited sees it, mostly bots, so don't
# use a personal or system mailbox. The page tells people to contact the server
# administrator when empty.
nginx_rate_limit_contact: ""
# Log requests that would be limited without rejecting them, to trial limits
nginx_rate_limit_dry_run: false
# Warn on the rate limit page that clients who keep trying may be blocked,
# e.g. by fail2ban
nginx_rate_limit_ban_notice: false

nginx_use_ssl: true
nginx_certs_dir: /etc/nginx/ssl
nginx_ssl_cert_file: /etc/nginx/ssl/server.cert
nginx_ssl_key_file: /etc/nginx/ssl/server.key

# Bit size for OpenSSL Diffie-Hellman Parameters. Higher bit sizes are more
# secure, but require exponentially larger times for the one-off parameter
# generation. Use 4096 for production. These may take 10mins+ to generate but
# are only generated once per server.
# For local testing (non-production), use 2048 to speed up deployment.
nginx_diffie_helman_size_bits: 4096
nginx_dh_params_file: /etc/nginx/ssl/dhparam.pem
