---
- name: Install sudo
  hosts: all
  gather_facts: true
  tasks:
    - name: Update YUM repo baseurls
      ansible.builtin.include_role:
        name: mirsg.infrastructure.provision
        tasks_from: RedHat7.yml
      when: ansible_facts['distribution_major_version'] is version('7')

    - name: Install sudo
      ansible.builtin.package:
        name: sudo
        state: present

- name: Install and configure Flask and Gunicorn
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install python and Flask/Gunicorn dependencies
      ansible.builtin.include_role:
        name: mirsg.infrastructure.install_python

    - name: Copy Flask app to host
      ansible.builtin.copy:
        src: app.py
        dest: /home/app.py
        owner: root
        group: root
        mode: "0644"

    - name: Create Gunicorn service config
      ansible.builtin.template:
        src: gunicorn_service.j2
        dest: /etc/systemd/system/gunicorn.service
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Start Gunicorn service
      ansible.builtin.systemd:
        name: gunicorn
        state: restarted

# nginx runs in a container on EL7. The nginx role doesn't configure the Docker
# daemon, so set the storage driver needed for Docker-in-Docker here.
- name: Configure Docker-in-Docker
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Use the vfs storage driver to avoid overlayfs issues
      when: ansible_facts['distribution_major_version'] is version('7', '==')
      block:
        - name: Ensure docker config directory exists
          ansible.builtin.file:
            path: /etc/docker
            owner: root
            group: root
            state: directory
            mode: "0700"

        - name: Write docker daemon configuration file
          ansible.builtin.copy:
            content: "{{ {'storage-driver': 'vfs'} | to_json }}"
            dest: /etc/docker/daemon.json
            owner: root
            group: root
            mode: "0640"

- name: Create SSL certificates for nginx
  hosts: all
  gather_facts: true
  tasks:
    - name:
        Create SSL certificate that expires in 1 year and store in server cache
      ansible.builtin.include_role:
        name: mirsg.infrastructure.ssl_certificates
      vars:
        ssl_certificate: "{{ nginx_old_ssl_certificate }}" # noqa: var-naming[no-role-prefix]
    - name:
        Create SSL certificate that expires in 10 years and store in nginx
        certificate directory
      ansible.builtin.include_role:
        name: mirsg.infrastructure.ssl_certificates
      vars:
        ssl_certificate: "{{ nginx_new_ssl_certificate }}" # noqa: var-naming[no-role-prefix]
