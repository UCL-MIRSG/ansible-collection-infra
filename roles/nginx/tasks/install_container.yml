---
- name: Install Docker
  ansible.builtin.include_role:
    name: mirsg.infrastructure.docker
  vars:
    # Docker is only used locally for nginx, so don't expose the daemon on TCP
    docker_tcp_enabled: false # noqa: var-naming[no-role-prefix]
    docker_generate_certificates: false # noqa: var-naming[no-role-prefix]

- name: Ensure nginx config and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ nginx_owner }}"
    group: "{{ nginx_group }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nginx_conf_file | dirname }}"
    - "{{ nginx_log_folder }}"

# Pull before the container is (re)started to keep downtime short
- name: Pull the nginx image
  community.docker.docker_image_pull:
    name: "{{ nginx_container_image }}"
    pull: not_present
