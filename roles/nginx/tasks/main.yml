---
- name: Configure SELinux if enabled and enforced
  when:
    ansible_selinux.status == "enabled" and ansible_selinux.mode == "enforcing"
  block:
    - name:
        Configure SELinux to allow nginx to listen on port {{
        nginx_upstream_listen_port }}
      community.general.seport:
        ports: "{{ nginx_upstream_listen_port }}"
        proto: tcp
        setype: http_port_t
        state: present
      when: nginx_upstream_listen_port is defined

    - name:
        Configure SELinux to allow httpd to act as relay and keep it persistent
        across reboots
      ansible.posix.seboolean:
        name: httpd_can_network_relay
        state: true
        persistent: true
      when:
        ansible_facts['os_family'] == "RedHat" and
        ansible_facts['distribution_major_version'] is version("8", ">=")

- name: Install nginx from the nginx.org repository
  ansible.builtin.include_tasks: install_package.yml
  when: nginx_install_method == "package"

- name: Install Docker and pull the nginx image
  ansible.builtin.include_tasks: install_container.yml
  when: nginx_install_method == "container"

- name: Copy certificates when SSL is enabled
  ansible.builtin.include_tasks: ssl_enabled.yml
  when: nginx_use_ssl

- name: Copy nginx config file
  ansible.builtin.template:
    src: "{{ nginx_conf_template }}"
    dest: "{{ nginx_conf_file }}"
    owner: "{{ nginx_owner }}"
    group: "{{ nginx_group }}"
    mode: "0644"
    force: true
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: nginx_install_method == "package"

- name: Ensure nginx container is running
  ansible.builtin.include_tasks: start_container.yml
  when: nginx_install_method == "container"

- name: Get installed nginx version
  ansible.builtin.command:
    cmd: >-
      {{ 'docker exec ' ~ nginx_container_name ~ ' nginx -v' if
      nginx_install_method == 'container' else '/usr/sbin/nginx -v' }}
  register: nginx_version_output
  changed_when: false

# The container image is pinned exactly; the package is a minimum version
- name: Assert the required nginx is running - {{ nginx_version }}
  ansible.builtin.assert:
    that:
      - >-
        nginx_installed_version == nginx_version
        if nginx_install_method == 'container' else
        nginx_installed_version is version(nginx_version, '>=')
    fail_msg:
      nginx {{ nginx_installed_version }} is installed, but {{ nginx_version }}{{
      '' if nginx_install_method == 'container' else ' or later' }} is required
    quiet: true
  vars:
    nginx_installed_version:
      "{{ nginx_version_output.stderr | regex_search('nginx/([0-9.]+)', '\\1') |
      first }}"
