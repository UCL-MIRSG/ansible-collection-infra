---
- name: Gather services
  ansible.builtin.service_facts:

# Hosts that previously ran nginx from EPEL must free the ports for the
# container. The package isn't removed, so it can be rolled back to.
- name: Stop and disable the nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  when: "'nginx.service' in ansible_facts.services"

- name: Start nginx container
  community.docker.docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ nginx_container_image }}"
    state: started
    # Use the host network so nginx listens on the host's ports and can proxy to
    # services on localhost
    network_mode: host
    volumes:
      # Mount the directory rather than the file, so the container sees the new
      # config when it is templated and can be reloaded without a restart
      - "{{ nginx_conf_file | dirname }}:/etc/nginx:ro"
      - "{{ nginx_certs_dir }}:{{ nginx_certs_dir }}:ro"
      - "{{ nginx_log_folder }}:{{ nginx_log_folder }}"
      # Log in the host's timezone. The error log has no UTC offset, so
      # fail2ban on the host reads its times as host time
      - /etc/localtime:/etc/localtime:ro
    restart_policy: always
