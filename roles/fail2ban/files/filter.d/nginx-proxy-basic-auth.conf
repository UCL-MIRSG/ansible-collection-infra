# Failed HTTP basic authentication with an application nginx proxies to, e.g.
# a wrong password for XNAT's REST API.
#
# Reads the nginx access log in the default "combined" format. nginx logs the
# basic auth username as $remote_user, so this only matches 401 responses to
# requests that sent credentials, and not e.g. a logged out browser tab.
#
# Example matching line:
# 192.0.2.1 - admin [25/Nov/2026:13:00:00 +0000] "GET /data/projects HTTP/1.1" 401 0 "-" "curl/8.0"

[Definition]

failregex = ^<HOST> - (?!- \[).+ \[[^\]]*\] "[^"]*" 401

ignoreregex =
