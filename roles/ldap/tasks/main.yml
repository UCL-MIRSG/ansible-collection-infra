---
# tasks file for ldap
- name: Ensure directory exists for cert files
  ansible.builtin.file:
    path: "{{ ldap_cert_dir }}"
    owner: "{{ ldap_cert_owner }}"
    group: "{{ ldap_cert_owner_group }}"
    state: directory
    mode: "0755"

- name: Copy CA certificate for LDAP server
  ansible.builtin.copy:
    src: "{{ ldap_ca_cert_path }}"
    dest: "{{ ldap_cert_dir }}/ldap-ca.cert"
    owner: "{{ ldap_cert_owner }}"
    group: "{{ ldap_cert_owner_group }}"
    mode: "0600"

- name: Add CA certificate for LDAP server to the system trust store
  ansible.builtin.include_role:
    name: mirsg.infrastructure.ca_trust
  vars:
    ca_trust_anchors:
      - name: "{{ ldap_java_keystore_alias }}"
        src: "{{ ldap_cert_dir }}/ldap-ca.cert"
        remote_src: true
