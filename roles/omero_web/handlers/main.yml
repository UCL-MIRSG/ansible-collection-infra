---
# handlers for omero-web
# Handler names are prefixed with the service to avoid clashing with the
# omero_server handlers when both roles are used in the same play

- name: Reload systemd for omero-web
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Rewrite omero-web configuration
  become: true
  become_user: "{{ omero_web_system_user }}"
  ansible.builtin.command: "{{ omero_web_config_update }}"
  changed_when: true

- name: Restart omero-web
  become: true
  ansible.builtin.service:
    name: omero-web
    state: restarted
  when: omero_web_systemd_setup and omero_web_systemd_start
