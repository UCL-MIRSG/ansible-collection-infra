---
- name: Ensure directories exist for cert files
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ xnat.owner }}"
    group: "{{ xnat.group }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ xnat.install_downloads }}"
    - "{{ xnat.install_downloads }}/certs"

- name: Copy ldap server certificate to client
  ansible.builtin.copy:
    src: "{{ xnat_ldap_ca_cert }}"
    dest: "{{ ldap_ca_cert_file_on_client }}"
    owner: "{{ xnat.owner }}"
    group: "{{ xnat.group }}"
    mode: "0600"

- name: Ensure XNAT LDAP auth folder exists
  ansible.builtin.file:
    path: "{{ xnat_config_dir }}/auth"
    owner: "{{ xnat.owner }}"
    group: "{{ xnat.group }}"
    state: directory
    mode: "0755"

- name: Configure LDAP for XNAT
  ansible.builtin.template:
    src: ldap1-provider.properties.j2
    dest: "{{ xnat_config_dir }}/auth/ldap1-provider.properties"
    owner: "{{ xnat.owner }}"
    group: "{{ xnat.group }}"
    mode: "0644"
    force: true
  notify: Restart tomcat
  tags: configure_xnat_ldap

- name: Add CA certificate for LDAP server to the system trust store
  ansible.builtin.include_role:
    name: mirsg.infrastructure.ca_trust
  vars:
    ca_trust_anchors:
      - name: "{{ xnat_ldap_keystore_alias | default('xnat-ldap-ca', true) }}"
        src: "{{ ldap_ca_cert_file_on_client }}"
        remote_src: true

- name: Restart tomcat if the system trust store changed
  ansible.builtin.debug:
    msg: System trust store updated
  when: ca_trust_changed | default(false)
  changed_when: true
  notify: Restart tomcat
