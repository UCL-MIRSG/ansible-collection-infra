---
# test this scenario from the roles/autofs directory with the command
# molecule --base-config ../../molecule_configs/rocky9_base_config.yml test --scenario-name rocky9
platforms:
  - name: client
    hostname: molecule.autofs.local
    image: rockylinux/rockylinux:9-ubi-init
    required: true
    command: ""
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    keep_volumes: false
    groups:
      - all
    docker_networks:
      - name: molecule_docker
        ipam_config:
          - subnet: 192.168.56.0/24
            gateway: 192.168.56.1
    networks:
      - name: molecule_docker
        ipv4_address: 192.168.56.2
    etc_hosts:
      molecule.samba.local: 192.168.56.3

  - name: server
    hostname: molecule.samba.local
    image: ghcr.io/dockur/samba:latest
    required: true
    command: ""
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - ./molecule-data:/storage/molecule
    keep_volumes: false
    groups:
      - all
    networks:
      - name: molecule_docker
        ipv4_address: 192.168.56.3
    exposed_ports:
      - 2376
    etc_hosts:
      molecule.autofs.local: 192.168.56.2

provisioner:
  name: ansible
  inventory:
    links:
      hosts: ../resources/inventory/hosts.yml
