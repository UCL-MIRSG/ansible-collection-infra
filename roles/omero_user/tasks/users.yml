---
- name: Get current user list
  become: true
  become_user: "{{ omero_user_system }}"
  ansible.builtin.command: >
    {{ omero_user_bin_omero }} user -C -s localhost -u {{ omero_user_admin_user
    }} -w {{ omero_user_admin_pass | quote }} list -q --style json
  register: _omero_user_usercmd
  check_mode: false
  changed_when: false
  no_log: true

- name: Set user list fact
  ansible.builtin.set_fact:
    omero_user_list: "{{ _omero_user_usercmd.stdout | from_json }}"

- name: Create user # noqa: no-changed-when
  become: true
  become_user: "{{ omero_user_system }}"
  ansible.builtin.command: >
    {{ omero_user_bin_omero }} user -C -s localhost -u {{ omero_user_admin_user
    }} -w {{ omero_user_admin_pass | quote }} add {{ item.login | quote }} {{
    item.firstname | quote }} {{ item.lastname | quote }} --userpassword {{
    item.password | quote }} {{ item.groups }}
  when: >
    (omero_user_list | selectattr('login', 'equalto', item.login) |
    list | length) < 1
  loop: "{{ omero_user_create }}"
  loop_control:
    label: "{{ item.login }}"
  no_log: true
