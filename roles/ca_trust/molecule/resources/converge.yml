---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: mirsg.infrastructure.ca_trust
      vars:
        ca_trust_anchors:
          - name: molecule-test-ca
            src: /tmp/test-ca.pem
            remote_src: true
          - name: molecule-test-server
            src: /tmp/test-server.pem
            remote_src: true
