---
name: Test install_xnat playbook

on:
  pull_request:
    paths:
      - molecule_configs/*
      - meta/el7-requirements.yml
      - meta/el9-requirements.yml
      - meta/el10-requirements.yml
      - playbooks/install_xnat.yml
      - playbooks/group_vars/**
      - playbooks/molecule/*_xnat*/**
      - playbooks/molecule/resources/xnat/**
      - playbooks/molecule/resources/shared/**
      - roles/docker/**
      - roles/firewalld/**
      - roles/install_java/**
      - roles/install_python/**
      - roles/nginx/**
      - roles/postgresql/**
      - roles/provision/**
      - roles/ssl_certificates/**
      - roles/tomcat/**
      - roles/xnat/**
      - roles/xnat_container_service/**
      - .github/workflows/molecule-install-xnat.yaml
      - "!**/README.md"
  schedule:
    # Run monthly to catch anything the paths filter misses, and breakage from
    # new releases of dependencies
    - cron: 0 6 1 * *
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  molecule-install-xnat:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        scenario:
          - centos7_xnat
          - centos7_xnat_1_10
          - rocky9_xnat
          - rocky9_xnat_1_10
          - alma10_xnat
          - alma10_xnat_1_10
    env:
      MOLECULE_RUN_TAGS: all
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1

    steps:
      - name:
          Edit apparmor profile for unix-chkpwd (see
          https://github.com/docker/build-push-action/issues/1302#issuecomment-3084652148)
        if: startsWith(matrix.scenario, 'rocky9_xnat')
        run: |-
          sudo sed -i \
            's/capability audit_write,$/&\n  # fix: read shadow permissions (linux-pam#686)\n  capability dac_read_search,/' \
            /etc/apparmor.d/unix-chkpwd
          sudo apparmor_parser -r /etc/apparmor.d/unix-chkpwd

      - uses: UCL-MIRSG/.github/actions/molecule-test@f0317ea26124fe0b3b923d881ac956301a11ea56 # v0
        with:
          ansible_major_version: ${{ vars.ANSIBLE_MAJOR_VERSION }}
          scenario: ${{ matrix.scenario }}
          checkout_path: ansible_collections/mirsg/infrastructure
          tests_path: ansible_collections/mirsg/infrastructure/playbooks
