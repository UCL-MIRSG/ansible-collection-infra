---
name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Check galaxy.yml version matches the release branch
        id: version
        run: |-
          VERSION=$(sed -n -E 's/^version: *//p' galaxy.yml)
          if [[ "${BRANCH}" != "release/${VERSION}" ]]; then
            echo "::error::galaxy.yml version '${VERSION}' does not match branch '${BRANCH}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |-
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${MERGE_SHA}" \
            --title "${VERSION}" \
            --generate-notes
