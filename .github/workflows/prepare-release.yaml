---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump-version:
        description: Bump the version (major, minor or patch)
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  prepare-release:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate new version
        id: version
        env:
          BUMP: ${{ inputs.bump-version }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          current=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          if [[ ! "${current}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Latest release tag '${current}' is not in the form X.Y.Z"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "${BUMP}" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "Bumping ${current} -> ${major}.${minor}.${patch}"
          echo "version=${major}.${minor}.${patch}" >> "${GITHUB_OUTPUT}"

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bump version in galaxy.yml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |-
          sed -i -E "s/^version: .*/version: ${VERSION}/" galaxy.yml
          git diff --exit-code --quiet galaxy.yml && {
            echo "::error::galaxy.yml is already at version ${VERSION}"
            exit 1
          }
          git diff galaxy.yml

      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: release/${{ steps.version.outputs.version }}
          base: main
          add-paths: galaxy.yml
          commit-message:
            "chore: bump collection version to ${{ steps.version.outputs.version
            }}"
          title: "chore: release ${{ steps.version.outputs.version }}"
          body: >-
            Bumps the collection version in `galaxy.yml` to `${{
            steps.version.outputs.version }}`. Merging this PR will create the
            `${{ steps.version.outputs.version }}` release.
          sign-commits: true
