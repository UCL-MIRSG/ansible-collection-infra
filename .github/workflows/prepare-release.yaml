---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.57.0)
        required: true
        type: string

jobs:
  prepare-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: release/${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version
        run: |-
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in the form X.Y.Z, got '${VERSION}'"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bump version in galaxy.yml
        run: |-
          sed -i -E "s/^version: .*/version: ${VERSION}/" galaxy.yml
          git diff --exit-code --quiet galaxy.yml && {
            echo "::error::galaxy.yml is already at version ${VERSION}"
            exit 1
          }
          git diff galaxy.yml

      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: release/${{ steps.version.outputs.version }}
          base: main
          add-paths: galaxy.yml
          commit-message:
            "chore: bump collection version to ${{ steps.version.outputs.version
            }}"
          title: "chore: release ${{ steps.version.outputs.version }}"
          body: >-
            Bumps the collection version in `galaxy.yml` to `${{
            steps.version.outputs.version }}`. Merging this PR will create the
            `${{ steps.version.outputs.version }}` release.
          sign-commits: true
