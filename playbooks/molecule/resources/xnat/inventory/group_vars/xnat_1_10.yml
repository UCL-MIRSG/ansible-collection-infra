---
xnat_version: 1.10.1
xnat_pipeline_version: 1.9.0

# Same as roles/xnat/defaults/main.yml's xnat_plugin_urls, except OHIF, which
# XNAT 1.10 requires >= 3.8.0.
xnat_plugin_urls:
  - https://github.com/NrgXnat/xsync/releases/download/1.8.1/xsync-plugin-all-1.8.1.jar
  - https://github.com/NrgXnat/ldap-auth-plugin/releases/download/1.3.0/ldap-auth-plugin-1.3.0.jar
  - https://github.com/xnatworks/ohif-viewer-xnat-plugin/releases/download/3.8.0/ohif-viewer-3.8.0-fat.jar
  - https://api.bitbucket.org/2.0/repositories/xnatdev/xnat-image-viewer-plugin/downloads/ximgview-plugin-1.0.2.jar
  - https://github.com/NrgXnat/dxm-settings-plugin/releases/download/1.0/dxm-settings-plugin-1.0.jar
  - https://github.com/NrgXnat/pipeline-engine-plugin/releases/download/1.2.0/pipeline_engine_ui-1.2.0-xpl.jar

# Same as all/server.yml's xnat_server_specific_plugin_urls, except
# batch-launch, which Container Service 3.8.x requires >= 0.9.0 on XNAT 1.10.
xnat_server_specific_plugin_urls:
  - https://github.com/NrgXnat/container-service/releases/download/3.8.1/container-service-3.8.1-fat.jar
  - https://github.com/NrgXnat/batch-launch-plugin/releases/download/0.9.0/batch-launch-0.9.0-xpl.jar
  - https://github.com/VUIIS/dax/raw/main/misc/xnat-plugins/dax-plugin-genProcData-1.4.2.jar
