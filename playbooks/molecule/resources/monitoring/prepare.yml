---
- name: Setup for the firewall
  hosts: all
  gather_facts: true
  tasks:
    - name: Update YUM repo baseurls
      ansible.builtin.include_role:
        name: mirsg.infrastructure.provision
        tasks_from: RedHat7.yml
      when: ansible_facts['distribution_major_version'] is version('7')

    - name: Install sudo
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Change firewalld backend to iptables
      ansible.builtin.lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: ^FirewallBackend=
        line: FirewallBackend=iptables

# Stand in for a public XNAT/OMERO host, whose default zone the monitoring
# deploy must leave alone. firewalld stays stopped until verify: starting it
# during converge flushes the NAT rules Docker's embedded DNS needs, so the
# role writes its rules offline here
- name: Set a public default zone on the clients
  hosts: monitoring_client
  gather_facts: false
  tasks:
    - name: Set the default zone to public
      ansible.builtin.command: firewall-offline-cmd --set-default-zone=public
      changed_when: true
