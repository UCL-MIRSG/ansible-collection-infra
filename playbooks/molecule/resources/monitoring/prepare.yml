---
- name: Setup for the firewall
  hosts: all
  gather_facts: true
  tasks:
    - name: Update YUM repo baseurls
      ansible.builtin.include_role:
        name: mirsg.infrastructure.provision
        tasks_from: RedHat7.yml
      when: ansible_facts['distribution_major_version'] is version('7')

    - name: Install sudo
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Change firewalld backend to iptables
      ansible.builtin.lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: ^FirewallBackend=
        line: FirewallBackend=iptables

# Stand in for a public XNAT/OMERO host, whose default zone the monitoring
# deploy must leave alone
- name: Start firewalld on the clients with a public default zone
  hosts: monitoring_client
  gather_facts: false
  tasks:
    - name: Start firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: started

    - name: Set the default zone to public
      ansible.builtin.command: firewall-cmd --set-default-zone=public
      changed_when: true
